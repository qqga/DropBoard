<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropBoard — Мгновенный обмен</title>
    <script src="/libs/tailwind/tailwind.js"></script>
    <script src="/libs/signalr_8.0.7/signalr.min.js"></script>
    <script src="/libs/qrcodejs_1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <span class="text-xl font-bold tracking-tight text-sky-400">⚡ DropBoard</span>
                <span id="statusBadge" class="text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">Подключение...</span>
            </div>

            <div class="flex items-center gap-2">
                <div class="flex items-center bg-slate-800 rounded-lg border border-slate-700 px-2 py-1">
                    <span class="text-slate-400 text-sm select-none">/</span>
                    <input id="roomInput" type="text" maxlength="32" class="bg-transparent text-sm text-white focus:outline-none w-28 sm:w-36 px-1 font-mono" placeholder="комната">
                    <button id="switchRoomBtn" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200 transition">Перейти</button>
                </div>
                <button id="copyUrlBtn" title="Скопировать ссылку" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm transition">
                    🔗
                </button>
                <button id="qrBtn" title="QR-код для телефона" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm transition">
                    📱 QR
                </button>
            </div>
        </div>
    </header>

    <main id="dropZone" class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 flex flex-col gap-6 border-2 border-transparent transition-colors">

        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
            <textarea id="textInput" rows="3" placeholder="Вставьте текст, ссылку, кусок кода или нажмите Ctrl+V чтобы вставить скриншот..."
                      class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 resize-y font-mono"></textarea>

            <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-4">
                    <label class="cursor-pointer inline-flex items-center gap-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg border border-slate-700 transition">
                        <span>📎 Прикрепить файл</span>
                        <input id="fileInput" type="file" class="hidden" multiple>
                    </label>

                    <label class="inline-flex items-center gap-2 text-xs text-slate-300 cursor-pointer select-none">
                        <input id="burnCheckbox" type="checkbox" class="rounded bg-slate-800 border-slate-600 text-rose-500 focus:ring-rose-500">
                        <span>🔥 Сжечь после прочтения/скачивания</span>
                    </label>
                </div>

                <button id="sendBtn" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm px-5 py-2 rounded-lg transition shadow">
                    Отправить
                </button>
            </div>
            <div id="uploadProgress" class="hidden mt-3 text-xs text-sky-400">Загрузка файла...</div>
            <div id="errorBanner" class="hidden mt-3 text-xs text-rose-400 bg-rose-950/50 border border-rose-800/50 rounded p-2"></div>
        </section>

        <section id="itemsContainer" class="flex flex-col gap-3"></section>

        <div id="emptyState" class="text-center py-12 text-slate-500 text-sm">
            В этой комнате пока пусто. Отправьте текст или перетащите сюда любые файлы (до 15 МБ).<br>
            <span class="text-xs text-slate-600">Все данные автоматически удаляются через 24 часа.</span>
        </div>
    </main>

    <div id="qrModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div id="qrModalCard" class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl">
            <h3 class="text-base font-semibold text-white mb-1">Открыть на телефоне</h3>
            <p class="text-xs text-slate-400 mb-4">Наведите камеру, чтобы попасть в эту же комнату</p>
            <div id="qrcode" class="bg-white p-3 rounded-xl inline-block mx-auto mb-4"></div>
            <button id="closeQrBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-sm py-2 rounded-lg text-slate-200">Закрыть</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
